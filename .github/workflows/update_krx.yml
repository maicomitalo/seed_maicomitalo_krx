name: Atualizar KRX Estrangeiros (6h BRT)

on:
  schedule:
    - cron: '0 9 * * 1-5'  # 06:00 BRT (09:00 UTC), segunda a sexta
  workflow_dispatch:       # Permite rodar manualmente para testar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Buscar dado do KRX
        run: python fetch_krx.py

      - name: Salvar atualização no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/KRX_FOREIGN_NET.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza KRX $(date +'%Y-%m-%d')" && git push)
